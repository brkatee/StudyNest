<!DOCTYPE html>
<html lang="ro"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudyNest</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
:root{--bg:#f4f7f2;--card:#fff;--ink:#24332f;--acc:#27665a;--acc2:#83a99b;--mut:#dce7e1;--ok:#347548;--bad:#a43f3f;--mid:#946413;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
header{padding:16px 16px 4px;display:flex;align-items:baseline;gap:8px}header h1{margin:0;font-size:22px;color:var(--acc)}header small{opacity:.7}
#main{padding:8px 16px;max-width:760px;margin:auto}
.card{background:var(--card);border:1px solid var(--mut);border-radius:14px;padding:14px;margin:10px 0}
h2{font-size:18px;margin:14px 0 6px}
button,.btn{background:var(--acc);color:var(--bg);border:0;border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer;display:inline-block}
button.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc2)}
button.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--acc2);margin:8px 0}
button.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 22%,var(--card))}button.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 22%,var(--card))}button.opt.selected{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 18%,var(--card))}
.drop{display:block;border:2px dashed var(--acc2);border-radius:16px;padding:28px 16px;text-align:center;cursor:pointer;background:var(--card)}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--acc2);border-radius:10px;padding:8px;resize:vertical}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;overflow-x:auto;background:var(--card);border-top:1px solid var(--mut);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1 0 52px;background:none;color:var(--ink);border-radius:0;padding:10px 2px;font-size:12px;opacity:.65}nav button.on{opacity:1;color:var(--acc);font-weight:700}
nav span{display:block;font-size:18px}
.chip{display:inline-block;background:var(--mut);color:var(--ink);border-radius:20px;padding:3px 11px;margin:3px 3px 3px 0;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.flip{min-height:190px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:18px;cursor:pointer}
.bar{height:8px;background:var(--mut);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.fb{font-weight:700;margin:8px 0}.ok{color:var(--ok)}.bad{color:var(--bad)}.mid{color:var(--mid)}
details{margin:6px 0}summary{cursor:pointer;font-weight:600}
.tree{border-left:2px solid var(--acc2);margin-left:6px;padding-left:12px}
.muted{opacity:.7;font-size:14px}
</style></head><body>
<header><h1>StudyNest</h1><small>studiu activ</small></header>
<div id="main"></div>
<nav>
<button data-t="docs" onclick="go('docs')"><span>📁</span>Documente</button>
<button data-t="text" onclick="go('text')"><span>📄</span>Text</button>
<button data-t="qa" onclick="go('qa')"><span>✏️</span>Î&amp;R</button>
<button data-t="quiz" onclick="go('quiz')"><span>🎯</span>Quiz</button>
<button data-t="cards" onclick="go('cards')"><span>🃏</span>Carduri</button>
<button data-t="map" onclick="go('map')"><span>🧠</span>Hartă</button>
<button data-t="profile" onclick="go('profile')"><span>👤</span>Progres</button>
</nav>
<script>
/* ===== Stocare (IndexedDB) ===== */
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db=null,docs=[],cur=null,tab='docs',quiz=null,card={i:0,f:false},status='',persist=true;
const openDB=()=>new Promise((ok,no)=>{const r=indexedDB.open('studynest',1);r.onupgradeneeded=()=>r.result.createObjectStore('docs',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const tx=(m,f)=>new Promise((ok,no)=>{const t=db.transaction('docs',m),q=f(t.objectStore('docs'));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error)});
const save=async d=>{if(db)try{await tx('readwrite',s=>s.put(d))}catch(e){persist=false}};
const del=async id=>{if(db)try{await tx('readwrite',s=>s.delete(id))}catch(e){}};
const D=()=>docs.find(x=>x.id===cur);

/* ===== Extragere text ===== */
async function readPdf(buf){
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const p=await pdfjsLib.getDocument({data:buf.slice(0)}).promise;let t='';
  for(let i=1;i<=p.numPages;i++){const c=await(await p.getPage(i)).getTextContent();t+=c.items.map(x=>x.str).join(' ')+'\n\n'}
  return t}
const readDocx=async buf=>(await mammoth.extractRawText({arrayBuffer:buf})).value;

/* ===== Analiză (euristică locală, fără server) ===== */
const STOP=new Set(('și sau dar într într-un într-o în la de cu pe din un o ale al a lui lor care ce cum este sunt fi fost se să nu mai pentru ca prin asupra între după către fără poate fiind sale său sa cel cea cei cele această acest aceste acești aceasta acestea the and of to in is are an that for with as on by it this be or from at which was were their its has have not can'.split(' ')));
const sents=t=>t.replace(/\s+/g,' ').split(/(?<=[.!?])\s+(?=[A-ZĂÂÎȘȚ0-9])/).map(s=>s.trim()).filter(s=>s.length>40&&s.length<320);
const words=s=>(s.toLowerCase().match(/[a-zăâîșşțţ-]{4,}/g)||[]).filter(w=>!STOP.has(w));
function analyze(text){
  const S=sents(text),f={};S.forEach(s=>words(s).forEach(w=>f[w]=(f[w]||0)+1));
  const concepts=Object.entries(f).filter(e=>e[1]>1).sort((a,b)=>b[1]-a[1]).slice(0,12).map(e=>e[0]);
  const sc=S.map((s,i)=>{const w=words(s);return{s,i,v:w.reduce((a,x)=>a+f[x],0)/Math.sqrt(w.length||1)}}).sort((a,b)=>b.v-a.v);
  const main=sc.slice(0,6).sort((a,b)=>a.i-b.i).map(x=>x.s),qa=[];
  const def=/^(.{3,60}?)\s+(este|sunt|reprezintă|se numește|constă în|înseamnă|is|are|means|refers to)\s+(.{15,})$/i;
  S.forEach(s=>{const m=s.match(def);if(m&&qa.length<15)qa.push({id:uid(),type:'def',q:`Ce ${/^(sunt|are)$/i.test(m[2])?'sunt':'este'} ${m[1].replace(/^(Un|O|Acest|Această|The|A|An)\s+/i,'')}?`,a:s})});
  sc.slice(0,40).forEach(({s})=>{if(qa.length>=25||qa.some(x=>x.a===s))return;
    const w=words(s).sort((a,b)=>f[b]-f[a])[0];if(!w)return;
    qa.push({id:uid(),type:'cloze',q:'Completează: '+s.replace(new RegExp(w,'i'),'_____'),a:w})});
  return{concepts,main,qa}}

/* ===== Încărcare ===== */
async function addFiles(files){
  for(const file of files){
    const ext=file.name.split('.').pop().toLowerCase();
    if(!['pdf','docx'].includes(ext)){status=`„${file.name}” nu e PDF sau DOCX.`;render();continue}
    status=`Se procesează ${file.name}…`;render();
    try{
      const buf=await file.arrayBuffer(),text=(ext==='pdf'?await readPdf(buf):await readDocx(buf)).trim();
      if(text.length<50){status=`Nu am găsit text în ${file.name} (poate e scanat).`;render();continue}
      const d={id:uid(),name:file.name,type:ext,size:file.size,added:Date.now(),text,notes:'',known:{},scores:[],file,...analyze(text)};
      docs.unshift(d);cur=d.id;await save(d);quiz=null;
      status=`Gata: ${d.qa.length} întrebări și ${d.concepts.length} concepte din ${file.name}.`;
    }catch(e){status='Eroare la citire: '+e.message}
  }
  render()}

/* ===== Interfață ===== */
function go(t){tab=t;const d=D();if(d&&t!=='docs'&&t!=='profile'){d.lastActivity={label:`A deschis ${({text:'textul',qa:'întrebările',quiz:'quiz-ul',cards:'cardurile',map:'harta'})[t]||t}`,tab:t,at:Date.now()};save(d)}render();scrollTo(0,0)}
function open_(id,destination='text'){cur=id;quiz=null;card={i:0,f:false};go(destination)}
async function rm(id){if(!confirm('Ștergi documentul?'))return;docs=docs.filter(x=>x.id!==id);await del(id);if(cur===id)cur=null;render()}
function render(){
  const d=D();let h='';
  if(tab==='docs')h=vDocs();
  else if(tab==='profile')h=vProfile();
  else if(!d)h='<div class=card>Încarcă sau alege mai întâi un document.</div>';
  else h=({text:vText,qa:vQA,quiz:vQuiz,cards:vCards,map:vMap})[tab](d);
  $('#main').innerHTML=h;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab))}
function vDocs(){
  return `<label class=drop ondragover="event.preventDefault()" ondrop="event.preventDefault();addFiles(event.dataTransfer.files)">
  <div style="font-size:34px">⬆️</div><b>Trage aici PDF / DOCX</b><div class=muted>sau apasă pentru a alege fișiere</div>
  <input type=file accept=".pdf,.docx" multiple hidden onchange="addFiles(this.files)"></label>
  ${status?`<div class=card>${esc(status)}</div>`:''}
  ${persist?'':'<div class="card bad">Stocarea locală nu e disponibilă; datele se pierd la reîncărcare.</div>'}
  <h2>Biblioteca ta (${docs.length})</h2>
  ${docs.map(d=>`<div class=card><b>${esc(d.name)}</b><div class=muted>${d.type.toUpperCase()} · ${(d.size/1024).toFixed(0)} KB · ${d.text.split(/\s+/).length} cuvinte · ${d.qa.length} întrebări · ${d.scores.length} teste</div>
  <div class=row style="margin-top:8px"><button onclick="open_('${d.id}')">Deschide</button><button class=ghost onclick="rm('${d.id}')">Șterge</button></div></div>`).join('')||'<div class=muted>Nimic încă. Documentele rămân salvate pe dispozitiv.</div>'}`}
function vProfile(){
  const scoreList=docs.flatMap(d=>(d.scores||[]).map(s=>({...s,name:d.name}))),attempts=scoreList.length;
  const points=scoreList.reduce((n,s)=>n+s.s,0),questions=scoreList.reduce((n,s)=>n+s.n,0);
  const errors=docs.flatMap(d=>(d.mistakes||[]).map(m=>({...m,name:d.name}))).sort((a,b)=>b.t-a.t);
  const activity=docs.filter(d=>d.lastActivity).map(d=>({...d.lastActivity,name:d.name,id:d.id})).sort((a,b)=>b.at-a.at)[0];
  const bytes=docs.reduce((n,d)=>n+(d.size||0),0),known=docs.reduce((n,d)=>n+Object.values(d.known||{}).filter(Boolean).length,0);
  const wordCount=docs.reduce((n,d)=>n+(d.text||'').split(/\s+/).filter(Boolean).length,0);
  return `<h2>Spațiul meu</h2><div class=card><div class=row><span class=chip>${docs.length} documente</span><span class=chip>${(bytes/1024/1024).toFixed(2)} MB încărcați</span><span class=chip>${wordCount} cuvinte</span></div>
  <p>Teste: <b>${attempts}</b> · Răspunsuri corecte: <b>${questions?Math.round(points/questions*100):0}%</b> · Carduri știute: <b>${known}</b></p>
  <p class=muted>${persist?'Datele sunt salvate local pe acest dispozitiv.':'Stocarea locală nu este disponibilă; datele nu vor rămâne după reîncărcare.'} Nu este un cont sincronizat între dispozitive.</p></div>
  <h2>Unde ai rămas</h2>${activity?`<div class=card><b>${esc(activity.name)}</b><div>${esc(activity.label)}</div><div class=muted>${new Date(activity.at).toLocaleString('ro-RO')}${activity.progress!=null?` · Întrebarea ${activity.progress}${activity.total?` din ${activity.total}`:''}`:''}</div><button style="margin-top:8px" onclick="open_('${activity.id}','${activity.tab||'text'}')">Deschide secțiunea</button></div>`:'<div class=card class=muted>Activitatea ta va apărea aici după ce deschizi un document.</div>'}
  <h2>Greșeli recente (${errors.length})</h2>${errors.slice(0,8).map(m=>`<div class=card><b>${esc(m.name)}</b><p>${esc(m.q)}</p><div class=bad>Răspunsul tău: ${esc(Array.isArray(m.val)?m.val.join(', '):m.val)||'—'}</div><div class=ok>Răspuns corect: ${esc(m.a)}</div><div class=muted>${new Date(m.t).toLocaleString('ro-RO')}</div></div>`).join('')||'<div class=card class=muted>Încă nu există greșeli înregistrate.</div>'}
  <h2>Documentele mele</h2>${docs.map(d=>`<div class=card><b>${esc(d.name)}</b><div class=muted>${d.scores?.length||0} teste · ${Object.values(d.known||{}).filter(Boolean).length} carduri știute · ${d.lastActivity?esc(d.lastActivity.label):'Nicio activitate recentă'}</div><button style="margin-top:8px" onclick="open_('${d.id}')">Deschide</button></div>`).join('')||'<div class=muted>Încarcă un PDF sau DOCX pentru a începe.</div>'}`}
function vText(d){
  return `<h2>${esc(d.name)}</h2><div class=muted>Editează textul extras, apoi regenerează conceptele și întrebările.</div>
  <textarea rows=16 onchange="editText(this.value)">${esc(d.text)}</textarea>
  <div class=row style="margin-top:8px"><button onclick="regen()">Regenerează local</button><button onclick="aiGen()">✨ Generează cu AI</button></div>${aiMsg?`<p class=muted>${esc(aiMsg)}</p>`:''}`}
function editText(v){const d=D();d.text=v;save(d)}
function regen(){const d=D();if(!confirm('Înlocuiești întrebările și conceptele actuale?'))return;Object.assign(d,analyze(d.text));quiz=null;save(d);go('qa')}
let aiMsg='';
const norm=s=>String(s||'').replace(/\s+/g,' ').trim().toLowerCase();
const stringList=value=>(Array.isArray(value)?value:[value]).filter(v=>typeof v==='string'&&v.trim()).map(v=>v.trim());
function prepareQuestions(raw,concepts,text,source){
  if(!Array.isArray(raw))return [];
  const parsed=raw.map(x=>{
    if(!x||typeof x!=='object')return null;
    const options=Array.isArray(x.options)?x.options:[];
    const optionText=o=>typeof o==='string'?o:(o&&typeof o==='object'?String(o.text||o.label||o.value||''):'');
    const markedCorrect=options.filter(o=>o&&typeof o==='object'&&(o.correct===true||o.isCorrect===true||o.is_correct===true)).map(optionText);
    const markedWrong=options.filter(o=>o&&typeof o==='object'&&(o.correct===false||o.isCorrect===false||o.is_correct===false)).map(optionText);
    const correct=[...stringList(x.answers),...stringList(x.correctAnswers),...stringList(x.correctAnswer),...stringList(x.correct_answers),...stringList(x.correct),...stringList(x.a||x.answer),...markedCorrect];
    const uniqueCorrect=[...new Map(correct.map(v=>[norm(v),v])).values()].slice(0,4);
    const wrong=[...stringList(x.wrong),...stringList(x.distractors),...markedWrong,...options.filter(o=>typeof o==='string').map(optionText)];
    const uniqueWrong=[...new Map(wrong.filter(v=>!uniqueCorrect.some(a=>norm(a)===norm(v))).map(v=>[norm(v),v])).values()].slice(0,4);
    const evidence=typeof x.evidence==='string'?x.evidence.trim():'';
    if(evidence&&!norm(text).includes(norm(evidence)))return null;
    const q=String(x.q||x.question||x.prompt||'').trim(),a=uniqueCorrect[0]||'';
    const declaredType=String(x.type||x.mode||'').toLowerCase();
    const cloze=/cloze|fill|blank/i.test(declaredType);
    return q&&a?{q,a,correct:uniqueCorrect,wrong:uniqueWrong,evidence,declaredType,cloze,choice:cloze||/single|multiple|multi|choice|gril|mc/i.test(declaredType)||options.length>0}:null;
  }).filter(Boolean);
  const alternatives=[...concepts,...(source==='local'?parsed.filter(x=>x.cloze).flatMap(x=>x.correct):[])];
  return parsed.map(x=>{
    const multi=x.correct.length>1;
    const isChoice=multi||x.choice||x.wrong.length>0;
    const wrong=isChoice?[...new Map([...x.wrong,...alternatives].filter(v=>!x.correct.some(a=>norm(a)===norm(v))).map(v=>[norm(v),v])).values()].slice(0,4):[];
    return{id:uid(),type:multi||wrong.length?'mc':'def',multi,q:x.q,a:x.a,answers:multi?x.correct:[],wrong,evidence:x.evidence,source};
  });
}
async function aiGen(){
  const d=D();if(!d)return;aiMsg='Se generează întrebările…';render();
  let r=null,aiError='';
  try{
    const sample=(typeof claude!=='undefined')?await claude.use('sample'):null;
    if(!sample)aiError='Serviciul Claude nu este disponibil în acest mediu.';
    else r=await sample.json('Analizează textul și generează întrebări de studiu în limba textului. Returnează DOAR JSON cu "concepts":[], "main":[] și "qa":[]. Fiecare element qa trebuie să aibă "q", "a" (răspunsul corect), "type" ("short", "single" sau "multiple"), "answers" (toate răspunsurile corecte pentru multiple-choice; minimum 2), "wrong" (3 variante greșite pentru single/multiple sau [] pentru short) și "evidence" (citat exact din text). Poți folosi și "options":[{"text":"...","correct":true/false}]. Nu inventa informații și bazează toate întrebările pe text.\n\nTEXT:\n'+d.text.slice(0,14000));
  }catch(e){aiError=e&&e.code==='not_granted'?'Permisiunea AI nu a fost acordată.':e&&e.code==='rate_limited'?'Serviciul AI a atins limita de cereri.':(e&&e.message)||'Serviciul AI nu a răspuns.'}
  const aiQuestions=prepareQuestions(Array.isArray(r?.qa)?r.qa:Array.isArray(r?.questions)?r.questions:[],stringList(r?.concepts),d.text,'ai').slice(0,20);
  const local=analyze(d.text);
  const usedAI=aiQuestions.length>0,qa=usedAI?aiQuestions:prepareQuestions(local.qa,local.concepts,d.text,'local').slice(0,25);
  if(!qa.length){aiMsg=`${aiError||'Generarea nu a produs întrebări'} Textul extras este prea scurt sau nu conține propoziții analizabile.`;render();return}
  d.qa=qa;d.concepts=usedAI&&Array.isArray(r.concepts)?stringList(r.concepts).slice(0,12):local.concepts;d.main=usedAI&&Array.isArray(r.main)?stringList(r.main).slice(0,6):local.main;
  quiz=null;d.known={};await save(d);
  aiMsg=usedAI?`AI a generat ${qa.length} întrebări; tipurile și variantele au fost setate automat. Verifică răspunsurile înainte de folosire.`:`${aiError||'AI nu a returnat întrebări utilizabile'} Am generat local ${qa.length} întrebări cu tipuri și variante setate automat. Acestea nu sunt generate de AI.`;
  go('qa')}
function vQA(d){
  return `${aiMsg?`<div class="card muted">${esc(aiMsg)}</div>`:''}<div class="row sp"><h2>Întrebări și răspunsuri (${d.qa.length})</h2><button onclick="addQA()">+ Adaugă</button></div>
  ${d.qa.map(x=>{const mode=modeOf(x);return `<div class=card><label class=muted>Tip întrebare <select onchange="setMode('${x.id}',this.value)"><option value="short" ${mode==='short'?'selected':''}>Răspuns scurt</option><option value="single" ${mode==='single'?'selected':''}>Alegere unică</option><option value="multiple" ${mode==='multiple'?'selected':''}>Alegere multiplă</option></select></label>
  <textarea rows=2 onchange="updQA('${x.id}','q',this.value)">${esc(x.q)}</textarea>
  ${mode==='multiple'?`<textarea rows=3 style="margin-top:6px" placeholder="Răspunsuri corecte, unul pe rând (minimum 2)" onchange="updQA('${x.id}','answers',this.value)">${esc((x.answers?.length?x.answers:[x.a]).join('\n'))}</textarea>`:`<textarea rows=${x.type==='cloze'?1:3} style="margin-top:6px" placeholder="Răspuns corect" onchange="updQA('${x.id}','a',this.value)">${esc(x.a)}</textarea>`}
  ${mode!=='short'?`<textarea rows=3 style="margin-top:6px" placeholder="Variante greșite, una pe rând" onchange="updQA('${x.id}','wrong',this.value)">${esc((x.wrong||[]).join('\n'))}</textarea>`:''}
  ${x.evidence?`<p class=muted>Susținere în document: „${esc(x.evidence)}” · verifică răspunsul AI</p>`:''}
  <button class=ghost style="margin-top:6px" onclick="delQA('${x.id}')">Șterge</button></div>`}).join('')}`}
function modeOf(x){return x.multi?'multiple':x.type==='mc'||x.type==='cloze'?'single':'short'}
function setMode(id,mode){const d=D(),x=d.qa.find(q=>q.id===id);x.multi=mode==='multiple';x.type=mode==='short'?'def':'mc';if(mode!=='multiple')delete x.answers;else if(!x.answers?.length)x.answers=[x.a];save(d);render()}
function updQA(id,k,v){const d=D(),x=d.qa.find(q=>q.id===id);x[k]=k==='answers'||k==='wrong'?v.split('\n').map(s=>s.trim()).filter(Boolean):v;save(d)}
function delQA(id){const d=D();d.qa=d.qa.filter(x=>x.id!==id);save(d);render()}
function addQA(){const d=D();d.qa.unshift({id:uid(),type:'def',q:'Întrebare nouă?',a:'Răspuns'});save(d);render()}

/* Quiz */
const shuf=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
function startQuiz(){
  const d=D(),base=d.qa.filter(x=>x.q.trim()&&x.a.trim()),dist=[...new Set([...d.concepts,...base.map(x=>x.a)])];
  const pool=base.filter(x=>modeOf(x)==='multiple'?x.answers?.filter(Boolean).length>=2:modeOf(x)==='single'?(x.wrong?.length||x.type==='cloze'||base.some(y=>y.id!==x.id&&y.a!==x.a)):true);
  const items=shuf(pool).slice(0,10).map(x=>{
    if(modeOf(x)==='multiple'){
      const wrong=[...(x.wrong||[]),...dist.filter(w=>!x.answers.some(a=>norm(a)===norm(w)))].filter((w,i,a)=>a.findIndex(v=>norm(v)===norm(w))===i).slice(0,4);
      return{...x,mc:true,multi:true,correct:x.answers,opts:shuf([...x.answers,...wrong])}}
    if(modeOf(x)==='single'){
      const wrong=[...(x.wrong||[]),...dist.filter(w=>norm(w)!==norm(x.a))].filter((w,i,a)=>a.findIndex(v=>norm(v)===norm(w))===i).slice(0,3);
      return{...x,mc:wrong.length>0,opts:wrong.length?shuf([x.a,...wrong]):null}}
    return{...x,mc:false,opts:null}});
  if(!items.length){alert('Nu există întrebări valide pentru test. Pentru alegerea multiplă adaugă cel puțin două răspunsuri corecte.');return}
  quiz={items,i:0,score:0,res:null,log:[],done:false,selected:[]};d.lastActivity={label:'A început un quiz',tab:'quiz',at:Date.now(),progress:0,total:items.length};save(d);render()}
function grade(u,a){
  const A=words(a),U=words(u);if(!A.length)return u.trim().toLowerCase()===a.trim().toLowerCase()?1:0;
  const h=A.filter(w=>U.some(x=>x.slice(0,5)===w.slice(0,5))).length;return h/A.length}
function answer(val){
  const it=quiz.items[quiz.i];if(quiz.res)return;let r;
  if(it.multi){const expected=it.correct.map(norm).sort(),actual=(Array.isArray(val)?val:[]).map(norm).sort();r=expected.length===actual.length&&expected.every((v,i)=>v===actual[i])?'ok':'bad'}
  else if(it.mc)r=norm(val)===norm(it.a)?'ok':'bad';
  else{const g=grade(val,it.a);r=g>=.4?'ok':g>=.2?'mid':'bad'}
  quiz.res={r,val};if(r==='ok')quiz.score++;else if(r==='mid')quiz.score+=.5;
  quiz.log.push({q:it.q,a:it.multi?it.correct.join(', '):it.a,val,r});const d=D();d.lastActivity={label:`Quiz: ${it.q}`,tab:'quiz',at:Date.now(),progress:quiz.i+1,total:quiz.items.length};save(d);render()}
function toggleOption(val){quiz.selected=quiz.selected.includes(val)?quiz.selected.filter(x=>x!==val):[...quiz.selected,val];render()}
function nextQ(){
  quiz.i++;quiz.res=null;
  if(quiz.i>=quiz.items.length){quiz.done=true;const d=D();d.scores.push({t:Date.now(),s:quiz.score,n:quiz.items.length});d.mistakes=d.mistakes||[];d.mistakes.push(...quiz.log.filter(x=>x.r!=='ok').map(x=>({...x,t:Date.now()})));d.lastActivity={label:'A terminat quiz-ul',tab:'quiz',at:Date.now(),progress:quiz.items.length,total:quiz.items.length};save(d)}
  else quiz.selected=[];
  render()}
function vQuiz(d){
  if(!quiz)return `<h2>Quiz</h2><div class=card>${d.qa.length} întrebări disponibile. Testul acceptă alegere unică, alegere multiplă și răspuns scurt.<div class=muted>Sesiunea curentă nu se reia automat după închiderea paginii.</div><div style="margin-top:10px"><button onclick="startQuiz()" ${d.qa.length?'':'disabled'}>Începe testul</button></div></div>
  ${d.scores.length?`<h2>Istoric</h2>${d.scores.slice(-6).reverse().map(s=>`<div class=card>${new Date(s.t).toLocaleString('ro-RO')} — <b>${s.s}/${s.n}</b></div>`).join('')}`:''}`;
  if(quiz.done){
    const n=quiz.items.length,p=Math.round(quiz.score/n*100),w=quiz.log.filter(x=>x.r!=='ok');
    return `<h2>Rezultat</h2><div class=card><div style="font-size:34px;font-weight:700;color:var(--acc)">${quiz.score}/${n} · ${p}%</div>
    <div class=bar><i style="width:${p}%"></i></div><p>Corecte: ${quiz.log.filter(x=>x.r==='ok').length} · Parțiale: ${quiz.log.filter(x=>x.r==='mid').length} · Greșite: ${quiz.log.filter(x=>x.r==='bad').length}</p>
    <button onclick="startQuiz()">Reia quiz-ul</button></div>
    ${w.length?'<h2>De revăzut</h2>'+w.map(x=>`<div class=card><b>${esc(x.q)}</b><div class=ok>${esc(x.a)}</div><div class=muted>Ai răspuns: ${esc(Array.isArray(x.val)?x.val.join(', '):x.val)||'—'}</div></div>`).join(''):''}`}
  const it=quiz.items[quiz.i],r=quiz.res;
  let body;
  if(it.mc)body=it.opts.map(o=>`<button class="opt ${it.multi&&quiz.selected.includes(o)?'selected':''} ${r?((it.multi?it.correct:[it.a]).some(a=>norm(a)===norm(o))?'ok':(Array.isArray(r.val)?r.val:[r.val]).some(v=>norm(v)===norm(o))?'bad':''):''}" onclick="${it.multi?'toggleOption(this.dataset.v)':'answer(this.dataset.v)'}" data-v="${esc(o)}">${it.multi?(quiz.selected.includes(o)?'☑ ':'☐ '):''}${esc(o)}</button>`).join('')+(it.multi&&!r?`<button style="margin-top:8px" onclick="answer(quiz.selected)">Verifică selecția</button>`:'');
  else body=`<textarea id=ua rows=3 placeholder="Scrie răspunsul…" ${r?'disabled':''}>${r?esc(r.val):''}</textarea>${r?'':'<div style="margin-top:8px"><button onclick="answer($(\'#ua\').value)">Verifică</button></div>'}`;
  return `<div class=muted>Întrebarea ${quiz.i+1} / ${quiz.items.length}</div><div class=bar><i style="width:${quiz.i/quiz.items.length*100}%"></i></div>
  <div class=card><b>${esc(it.q)}</b>${body}
  ${r?`<div class="fb ${r.r}">${{ok:'✔ Corect',mid:'≈ Parțial corect',bad:'✘ Greșit'}[r.r]}</div>${r.r!=='ok'?`<div class=muted>Răspuns corect:</div><div>${esc(it.multi?it.correct.join(', '):it.a)}</div>`:''}<div style="margin-top:10px"><button onclick="nextQ()">${quiz.i+1<quiz.items.length?'Următoarea':'Vezi scorul'}</button></div>`:''}</div>`}

/* Flashcards */
function vCards(d){
  const c=d.qa;if(!c.length)return '<div class=card>Nu există carduri.</div>';
  const i=Math.min(card.i,c.length-1),x=c[i],k=Object.values(d.known).filter(Boolean).length;
  return `<div class="row sp"><h2>Carduri</h2><span class=muted>${i+1}/${c.length} · știute: ${k}</span></div>
  <div class="card flip" onclick="card.f=!card.f;render()">${card.f?esc(x.a):esc(x.q)}</div>
  <div class=muted style="text-align:center">Atinge cardul pentru a-l întoarce</div>
  <div class=row style="justify-content:center;margin-top:10px">
  <button class=ghost onclick="mv(-1)">←</button><button onclick="mark(false)">Mai repet</button><button onclick="mark(true)">Știu</button><button class=ghost onclick="mv(1)">→</button></div>
  ${d.known[x.id]===true?'<p class=ok style="text-align:center">marcat ca știut</p>':''}`}
function mv(n){const l=D().qa.length;card.i=(card.i+n+l)%l;card.f=false;render()}
function mark(v){const d=D();d.known[d.qa[card.i].id]=v;save(d);mv(1)}

/* Hartă / note */
function vMap(d){
  const tree=d.concepts.slice(0,8).map(c=>{
    const ss=sents(d.text).filter(s=>s.toLowerCase().includes(c)).slice(0,2);
    return `<details><summary>${esc(c)}</summary><div class=tree>${ss.map(s=>`<p class=muted>${esc(s)}</p>`).join('')||'<p class=muted>—</p>'}</div></details>`}).join('');
  return `<h2>Idei principale</h2><div class=card>${d.main.map(s=>`<p>• ${esc(s)}</p>`).join('')||'—'}</div>
  <h2>Concepte cheie</h2><div>${d.concepts.map(c=>`<span class=chip>${esc(c)}</span>`).join('')}</div>
  <h2>Hartă mentală</h2><div class=card><b style="color:var(--acc)">◉ ${esc(d.name.replace(/\.\w+$/,''))}</b><div class=tree>${tree}</div></div>
  <h2>Notele mele</h2><textarea rows=8 placeholder="Sinteza ta…" onchange="D().notes=this.value;save(D())">${esc(d.notes)}</textarea>`}
